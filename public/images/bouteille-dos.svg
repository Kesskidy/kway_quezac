<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" id="bottle-back">
  <title>Bouteille Quézac ouverte, portée dans le dos</title>
  <!--
    Même repère que veste-gr70-profil.svg et personnage-neutre.svg.
    Ordre des calques :
      #bottle        DERRIÈRE la veste (avant #kway-body) : la bouteille et son porte-bouteille
      #bottle-strap  PAR-DESSUS le corps de la veste, mais SOUS #kway-arm-front : la sangle en bandoulière
    Goulot ouvert (sans bouchon) : centre de l'ouverture en 128 118 (cible de la main).
    #bottle-water : l'eau, dont le haut est à y = 212 (peut monter pour une fin perdante).
  -->
  <defs>
    <linearGradient id="bottle-plastic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F8FD4"/>
      <stop offset="0.35" stop-color="#7CCBF3"/>
      <stop offset="0.7" stop-color="#4FB0E8"/>
      <stop offset="1" stop-color="#1F74B8"/>
    </linearGradient>
    <linearGradient id="bottle-water-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D6FB4"/>
      <stop offset="0.4" stop-color="#4AA8E3"/>
      <stop offset="1" stop-color="#1A63A3"/>
    </linearGradient>
    <clipPath id="bottle-inside">
      <path d="M121,133 L135,133 C136,150 137,165 140,178 C146,192 151,200 151,212 L151,278 C151,284 148,288 142,288 L138,284 L132,289 L124,289 L118,284 L114,288 C108,288 105,284 105,278 L105,212 C105,200 110,192 116,178 C119,165 120,150 121,133 Z"/>
    </clipPath>
  </defs>

  <g id="bottle">
    <!-- Corps en plastique -->
    <path id="bottle-body" d="M121,133 L135,133 C136,150 137,165 140,178 C146,192 151,200 151,212 L151,278 C151,284 148,288 142,288 L138,284 L132,289 L124,289 L118,284 L114,288 C108,288 105,284 105,278 L105,212 C105,200 110,192 116,178 C119,165 120,150 121,133 Z" fill="url(#bottle-plastic)" opacity="0.92"/>

    <!-- Eau et bulles, découpées à l'intérieur de la bouteille -->
    <g clip-path="url(#bottle-inside)">
      <rect id="bottle-water" x="100" y="212" width="56" height="80" fill="url(#bottle-water-fill)" opacity="0.75"/>
      <path d="M100,212 H156" stroke="#BFE6FA" stroke-width="2" opacity="0.8"/>
      <g id="bottle-bubbles" fill="none" stroke="#E4F4FD" stroke-width="1.2">
        <circle cx="114" cy="230" r="2"/><circle cx="124" cy="222" r="1.5"/><circle cx="138" cy="234" r="2.2"/>
        <circle cx="130" cy="244" r="1.4"/><circle cx="118" cy="282" r="1.8"/><circle cx="142" cy="282" r="1.5"/>
        <circle cx="128" cy="200" r="1.3"/><circle cx="122" cy="186" r="1.1"/>
      </g>
    </g>

    <!-- Reflet -->
    <path d="M114,214 C112,240 112,262 114,276" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M125,140 C124,160 122,175 118,188" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

    <!-- Étiquette (sans logo : à remplacer si besoin) -->
    <g id="bottle-label">
      <rect x="105" y="246" width="46" height="28" fill="#0B2D5B"/>
      <rect x="114" y="252" width="28" height="4" rx="1" fill="#F5F3ED"/>
      <rect x="122" y="259" width="12" height="2.5" rx="1" fill="#BB7333"/>
      <rect x="112" y="266" width="32" height="1" fill="#BB7333" opacity="0.8"/>
    </g>

    <!-- Goulot ouvert, fileté, sans bouchon -->
    <g id="bottle-mouth">
      <rect x="120" y="118" width="16" height="13" rx="1.5" fill="#5DB7EC"/>
      <path d="M120,122 H136 M120,126 H136" stroke="#2F8FD4" stroke-width="1.2"/>
      <rect x="117" y="130" width="22" height="4" rx="2" fill="#3A9BDD"/>
      <ellipse cx="128" cy="118" rx="8" ry="2.2" fill="#0F4C80"/>
    </g>

    <!-- Porte-bouteille : deux bandes autour de la bouteille -->
    <g id="bottle-holder" fill="#2B2D2F">
      <rect x="102" y="214" width="52" height="9" rx="3"/>
      <rect x="102" y="278" width="52" height="9" rx="3"/>
      <path d="M106,218.5 H150 M106,282.5 H150" stroke="#F5F3ED" stroke-width="1" stroke-dasharray="2 3"/>
    </g>
  </g>

  <!-- Sangle en bandoulière : du porte-bouteille, par-dessus l'épaule, jusqu'à la hanche avant -->
  <g id="bottle-strap">
    <path d="M146,214 L156,150 C160,140 170,136 178,140 L266,342 L256,348 L172,154 C168,150 164,152 163,156 L154,218 Z" fill="#2B2D2F"/>
    <path d="M151,212 L160,154 M174,150 L259,341" fill="none" stroke="#F5F3ED" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
    <rect x="250" y="336" width="18" height="12" rx="2" transform="rotate(-24 259 342)" fill="#BB7333"/>
  </g>
</svg>
