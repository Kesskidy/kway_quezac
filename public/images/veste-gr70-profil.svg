<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" id="kway-gr70">
  <title>Veste K-Way × Quézac GR70, vue de profil</title>
  <defs>
    <linearGradient id="kway-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061A38"/>
      <stop offset="0.5" stop-color="#0B2D5B"/>
      <stop offset="1" stop-color="#0F3A70"/>
    </linearGradient>
    <linearGradient id="kway-sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A2A55"/>
      <stop offset="1" stop-color="#14427D"/>
    </linearGradient>
    <linearGradient id="kway-bronze" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8E5222"/>
      <stop offset="0.45" stop-color="#BB7333"/>
      <stop offset="1" stop-color="#E3A266"/>
    </linearGradient>
  </defs>

  <!-- Corps -->
  <g id="kway-body">
    <path d="M176,126 C160,130 146,142 140,160 C130,220 132,300 138,360 C140,372 146,380 156,384 L250,384 C260,380 266,372 266,360 C272,300 272,220 262,160 C258,146 252,136 246,130 Z" fill="url(#kway-shade)"/>
    <!-- Pan arrière plus sombre pour le volume -->
    <path d="M176,126 C160,130 146,142 140,160 C130,220 132,300 138,360 L158,362 C152,300 152,220 160,152 C164,140 170,132 176,126 Z" fill="#051530" opacity="0.6"/>
    <!-- Broderies bronze : lames qui remontent du bas du dos vers l'épaule -->
    <g id="kway-flames-back" fill="url(#kway-bronze)">
      <path d="M142,334 L150,346 L196,268 Z"/>
      <path d="M140,300 L148,314 L204,222 Z"/>
      <path d="M141,268 L148,282 L210,184 Z"/>
      <path d="M144,236 L151,250 L206,156 Z"/>
      <path d="M150,206 L156,218 L196,146 Z"/>
      <path d="M146,320 L151,328 L178,288 Z" opacity="0.8"/>
      <path d="M144,286 L149,294 L184,244 Z" opacity="0.8"/>
    </g>
    <!-- Bas élastiqué, plus étroit que le buste -->
    <path id="kway-hem" d="M150,376 H258 C262,376 264,380 264,384 V394 C264,398 262,400 258,400 H150 C146,400 144,398 144,394 V384 C144,380 146,376 150,376 Z" fill="#08234A"/>
    <path d="M150,388 H258" stroke="#123C72" stroke-width="2" stroke-dasharray="3 4"/>
  </g>

  <!-- Zip central : bande beige, filets bronze et bleu -->
  <g id="kway-zip">
    <path d="M248,134 C262,170 268,260 263,378" fill="none" stroke="#F5F3ED" stroke-width="6" stroke-linecap="round"/>
    <path d="M248,134 C262,170 268,260 263,378" fill="none" stroke="#BB7333" stroke-width="1.4"/>
    <path d="M251,135 C265,171 271,260 266,376" fill="none" stroke="#5E7FA8" stroke-width="0.9"/>
    <rect x="251" y="140" width="7" height="13" rx="2" fill="#C9C4B8"/>
  </g>

  <!-- Capuche -->
  <g id="kway-hood">
    <path d="M176,130 C160,98 166,42 212,32 C254,26 276,56 272,94 C270,112 260,126 248,134 C226,142 200,142 176,134 Z" fill="url(#kway-shade)"/>
    <!-- Ouverture du visage : la tête du personnage se place ici -->
    <path id="kway-hood-opening" d="M246,52 C268,62 274,96 256,126 C242,116 236,84 246,52 Z" fill="#04112A"/>
    <!-- Couture centrale de la capuche -->
    <path d="M210,36 C196,62 192,96 198,124" fill="none" stroke="#051530" stroke-width="2"/>
    <!-- Cordon de serrage -->
    <path d="M254,122 C257,134 255,146 250,154" fill="none" stroke="#F5F3ED" stroke-width="2" stroke-linecap="round"/>
    <rect x="246" y="152" width="8" height="12" rx="3" fill="#9A9488"/>
  </g>

  <!--
    Bras avant articulé :
      #kway-arm-front    haut du bras, pivote à l'épaule (svgOrigin 205 150)
      #kway-forearm      avant-bras (emboîté), pivote au coude (svgOrigin 203 226)
    Pose « main sur le goulot » (bouteille-dos.svg, goulot en 128 118) :
      #kway-arm-front rotation -157,  #kway-forearm rotation -118
  -->
  <g id="kway-arm-front" data-pivot="205 150">
    <clipPath id="kway-upperarm-clip">
      <path d="M188,138 C176,150 172,172 176,198 L180,226 C182,240 222,242 225,228 L224,190 C226,164 220,146 208,138 C202,135 194,135 188,138 Z"/>
    </clipPath>
    <clipPath id="kway-forearm-clip">
      <path d="M181,224 C181,210 225,210 225,224 L226,240 C228,262 232,282 234,300 L204,304 C196,296 190,284 188,268 L181,228 Z"/>
    </clipPath>

    <!-- Avant-bras : dessiné en premier pour passer sous le coude du haut du bras -->
    <g id="kway-forearm" data-pivot="203 226">
      <path d="M181,224 C181,210 225,210 225,224 L226,240 C228,262 232,282 234,300 L204,304 C196,296 190,284 188,268 L181,228 Z" fill="url(#kway-sleeve)" stroke="#051530" stroke-width="2" stroke-linejoin="round"/>
      <!-- Relief du GR70, partie basse -->
      <path id="kway-gr70-relief-low" clip-path="url(#kway-forearm-clip)" d="M190,228 L197,244 L192,258 L199,272 L195,286 L202,298" fill="none" stroke="#BB7333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <text transform="translate(213 274) rotate(-80)" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="1" fill="#D08A4B">GR70</text>
      <!-- Poignet élastiqué -->
      <path id="kway-cuff" d="M203,300 L235,296 L237,318 C237,320 236,322 234,322 L208,325 C206,325 205,324 205,322 Z" fill="#08234A"/>
      <path d="M207,312 L234,309" stroke="#123C72" stroke-width="2" stroke-dasharray="3 4"/>
    </g>

    <!-- Haut du bras -->
    <path d="M188,138 C176,150 172,172 176,198 L180,226 C182,240 222,242 225,228 L224,190 C226,164 220,146 208,138 C202,135 194,135 188,138 Z" fill="url(#kway-sleeve)" stroke="#051530" stroke-width="2" stroke-linejoin="round"/>
    <!-- Couture raglan -->
    <path d="M196,137 C186,154 182,176 184,200" fill="none" stroke="#051530" stroke-width="1.5" opacity="0.7"/>
    <!-- Relief du GR70, partie haute -->
    <path id="kway-gr70-relief-high" clip-path="url(#kway-upperarm-clip)" d="M190,150 L194,162 L188,174 L195,188 L189,202 L196,216 L190,230" fill="none" stroke="#BB7333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
